<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f2">
  <title>Peta Weberek</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #23332d;
      background: #f5f7f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px;
    }

    .page {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    .heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #698276;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: -0.045em;
      line-height: 1.1;
    }

    .subtitle {
      max-width: 460px;
      margin: 10px 0 0;
      color: #6a7972;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 1px solid #dfe8df;
      border-radius: 999px;
      background: #fff;
      color: #52665a;
      font-size: 0.8rem;
      font-weight: 650;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e2a84a;
      content: "";
    }

    .status.ready::before {
      background: #53a477;
    }

    .map-card {
      overflow: hidden;
      border: 1px solid #e3e9e1;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(34 57 43 / 8%);
    }

    #map {
      width: 100%;
      height: min(68vh, 650px);
      min-height: 390px;
      background: #e9eee7;
    }

    .map-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 20px;
      color: #718078;
      font-size: 0.82rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .legend-line {
      width: 24px;
      height: 0;
      border-top: 3px solid #b77745;
    }

    .legend-area {
      width: 17px;
      height: 13px;
      border: 1px solid #62836c;
      border-radius: 3px;
      background: rgb(112 157 117 / 22%);
    }

    .error {
      display: none;
      margin: 0;
      padding: 12px 20px;
      background: #fff2ed;
      color: #9d412d;
      font-size: 0.9rem;
    }

    .error.visible {
      display: block;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 10px;
    }

    .popup-title {
      margin-bottom: 4px;
      color: #23332d;
      font-weight: 750;
    }

    .popup-detail {
      color: #718078;
    }

    @media (max-width: 640px) {
      body {
        padding: 22px 14px;
      }

      .heading {
        align-items: flex-start;
        flex-direction: column;
      }

      #map {
        height: 62vh;
        min-height: 360px;
      }

      .map-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="heading">
      <div>
        <p class="eyebrow">Sistem Informasi Geografis</p>
        <h1>Peta Topografi Weberek</h1>
        <p class="subtitle">Peta topografi wilayah Dotik, Manufahi, dengan titik acuan dan jangkauan radius 20 km.</p>
      </div>
      <span class="status" id="status">Memuat data peta</span>
    </header>

    <section class="map-card" aria-label="Peta kontur Weberek">
      <div id="map"></div>
      <p class="error" id="error" role="alert"></p>
      <footer class="map-footer">
        <div class="legend" aria-label="Legenda peta">
          <span class="legend-item"><span class="legend-line"></span>Kontur topografi</span>
          <span class="legend-item"><span class="legend-area"></span>Radius 20 km</span>
        </div>
        <span>Peta: OpenTopoMap · Titik dan radius: geo.json</span>
      </footer>
    </section>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./crott.js"></script>
</body>
</html>
